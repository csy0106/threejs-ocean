<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>微沫生命周期检查</title>
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
<style>body{font:16px system-ui;background:#132d3b;color:#eef6f8;margin:24px}button{padding:12px;margin:8px}iframe{width:1200px;height:800px;border:0}img{width:48%;vertical-align:top}pre{white-space:pre-wrap}</style>
<h1>微沫生命周期 · 画面对照</h1><button id="run">运行微沫检查</button><p id="status">等待场景</p>
<pre id="report"></pre><h2>同帧对照：左关闭 / 右开启</h2><img id="off"><img id="on"><h2>默认海况</h2><img id="calm"><h2>微沫随时间变化</h2><img id="time0"><img id="time1"><img id="time2">
<iframe id="demo" src="/"></iframe>
<script type="module">
import * as THREE from 'three';
const frame=document.querySelector('#demo'),status=document.querySelector('#status'),report=document.querySelector('#report');
const ready=new Promise(resolve=>{const timer=setInterval(()=>{if(frame.contentWindow.oceanDemo?.getState().ready){clearInterval(timer);status.textContent='场景就绪';resolve(frame.contentWindow.oceanDemo);}},200);});
const yieldUI=()=>new Promise(resolve=>setTimeout(resolve,0));
let running=false;
document.querySelector('#run').onclick=async()=>{
 if(running)return;running=true;document.querySelector('#run').disabled=true;report.textContent='';
 let app,cleanup=()=>{};
 try{
  app=await ready;app.pause();app.setView('coast',true);app.controls.enableDamping=false;
  const canvas=app.renderer.domElement,box=frame.contentDocument.querySelector('#foam');
  const setFoam=v=>{if(box.checked!==v)box.click();};
  const pixels=()=>{app.render();const gl=app.renderer.getContext(),data=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,data);return data;};
  const advance=async(start,seconds)=>{for(let i=1;i<=Math.round(seconds*40);i++){app.setTime(start+i/40);if(i%3===0)await yieldUI();}};
  let results=[],restores=true;
  for(const strength of [.15,.65,.69,1.22,1.5]){
   status.textContent='检查波浪强度 '+strength;
   app.uniforms.uWave.value=strength;app.setTime(6.5);await advance(6.5,1.5);
   setFoam(false);const off=pixels(),offURL=canvas.toDataURL();setFoam(true);const on=pixels(),onURL=canvas.toDataURL();
   setFoam(false);const restored=pixels();restores&&=off.every((v,i)=>v===restored[i]);setFoam(true);
   let visible=0,mean=0,max=0;const count=Math.floor(off.length/4*.75);
   for(let p=0;p<count;p++){const i=p*4,d=Math.max(Math.abs(on[i]-off[i]),Math.abs(on[i+1]-off[i+1]),Math.abs(on[i+2]-off[i+2]));if(d>=8)visible++;mean+=d;max=Math.max(max,d);}
   results.push({strength,visiblePercent:visible/count*100,meanDifference:mean/count,maxDifference:max});
   if(strength===.65)document.querySelector('#calm').src=onURL;
   if(strength===1.22){document.querySelector('#off').src=offURL;document.querySelector('#on').src=onURL;}
   await yieldUI();
  }
  // Measure stored density independently of the surface's lighting and waves.
  const target=new THREE.WebGLRenderTarget(128,128,{type:THREE.FloatType,depthBuffer:false});
  const material=new THREE.ShaderMaterial({uniforms:{map:app.uniforms.uFoamMap},vertexShader:'varying vec2 v;void main(){v=uv;gl_Position=vec4(position.xy,0.,1.);}',fragmentShader:'uniform sampler2D map;varying vec2 v;void main(){gl_FragColor=texture2D(map,v);}',depthTest:false,depthWrite:false});
  const scene=new THREE.Scene(),cam=new THREE.Camera(),geometry=new THREE.PlaneGeometry(2,2);
  cleanup=()=>{target.dispose();material.dispose();geometry.dispose();};
  // The renderer lives in the iframe: its typed-array checks use that realm.
  for(const attribute of Object.values(geometry.attributes))attribute.array=new frame.contentWindow.Float32Array(attribute.array);
  geometry.index.array=new frame.contentWindow.Uint16Array(geometry.index.array);
  scene.add(new THREE.Mesh(geometry,material));
  const density=()=>{app.renderer.setRenderTarget(target);app.renderer.render(scene,cam);const values=new Float32Array(128*128*4);app.renderer.readRenderTargetPixels(target,0,0,128,128,values);let fresh=0,residue=0;for(let i=0;i<values.length;i+=4){fresh+=values[i];residue+=values[i+1];}app.renderer.setRenderTarget(null);return {fresh:fresh/(128*128),residue:residue/(128*128),total:(fresh+residue)/(128*128)};};
  app.uniforms.uWave.value=1.22;app.setTime(6.5);await advance(6.5,1.5);
  document.querySelector('#time0').src=canvas.toDataURL();await advance(8,.3);document.querySelector('#time1').src=canvas.toDataURL();await advance(8.3,.3);document.querySelector('#time2').src=canvas.toDataURL();
  const before=app.foamSimulation.getState().updates;app.render();app.render();const paused=app.foamSimulation.getState().updates===before;
  const lifetime=[density()];app.foamSimulation.setEmission(0);await advance(8.6,.5);lifetime.push(density());await advance(9.1,1.5);lifetime.push(density());app.foamSimulation.setEmission(1);
  const qualities=[];for(const quality of ['low','high','balanced']){app.setQuality(quality);app.render();qualities.push({quality,...app.foamSimulation.getState()});}
  const checks={visibleAtDefault:results[1].visiblePercent>.1,sparseStrongFoam:results[3].visiblePercent>results[1].visiblePercent&&results[3].visiblePercent<7,calmHasNoFoam:results[0].visiblePercent===0,toggleRestoresPixels:restores,pauseFreezesHistory:paused,persistsAfterEmissionStops:lifetime[1].total>0&&lifetime[1].total<lifetime[0].total,decaysWithTime:lifetime[2].total<lifetime[1].total*.5,noShaderError:!app.getState().shaderError};
  report.textContent=JSON.stringify({passed:Object.values(checks).every(Boolean),checks,results,lifetime,qualities},null,2);status.textContent='检查完成';
 }catch(e){status.textContent='检查失败';report.textContent=e.stack;}
 finally{app?.foamSimulation.setEmission(1);cleanup();running=false;document.querySelector('#run').disabled=false;}
};
</script></html>
